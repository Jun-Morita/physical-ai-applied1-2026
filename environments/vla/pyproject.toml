[project]
name = "landing-vla"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot[smolvla]==0.4.3",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "torchcodec==0.5.0",
  "pillow>=11,<12",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
